name: Offline analysis and charts

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/offline-analysis.yml'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'outputs/derived/**'
      - 'outputs/figures/**'
      - 'config/data_manifest.yaml'
      - 'pyproject.toml'
  pull_request:
    paths:
      - '.github/workflows/offline-analysis.yml'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'outputs/derived/**'
      - 'outputs/figures/**'
      - 'config/data_manifest.yaml'
      - 'pyproject.toml'

permissions:
  contents: read

jobs:
  verify-offline-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Run offline test suite
        run: python -m unittest discover -s tests -v

      - name: Validate portable manifest and derived artifacts
        shell: bash
        run: |
          set +e
          python -m icdar_tta.validate
          code=$?
          set -e
          # Exit 2 means all checkable gates passed but the gitignored local
          # data manifest is intentionally unavailable on the cloud runner.
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            exit "$code"
          fi

      - name: Regenerate presentation charts
        run: python scripts/generate_charts.py --derived-dir outputs/derived --figure-dir outputs/figures

      - name: Verify generated charts are committed reproducibly
        run: git diff --exit-code -- outputs/figures

      - name: Upload regenerated presentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: icdar-tta-offline-analysis-${{ github.sha }}
          path: |
            outputs/figures/*.svg
            outputs/figures/*.png
            outputs/derived/*.csv
          if-no-files-found: error
          retention-days: 30
