[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "icdar-tta"
version = "0.1.0"
description = "Offline analysis core for the ICDAR 2026 TTA presentation/replication workspace."
requires-python = ">=3.9"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
# Intentionally dependency-light. PyYAML is only required if/when
# config/data_manifest*.yaml parsing is exercised; a stdlib-only fallback
# parser is used when it is unavailable so the offline core has zero
# mandatory third-party dependencies.
yaml = ["PyYAML>=6.0"]
test = ["pytest>=7.0"]
modern = [
  "PyYAML>=6.0",
  "httpx>=0.27",
  "Pillow>=10.0",
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
]

[project.scripts]
icdar-tta-validate = "icdar_tta.validate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
