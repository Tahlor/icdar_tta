schema_version: 1
project: icdar_tta

# Copy to data_manifest.local.yaml for machine-specific paths.
# The local file is intentionally ignored by Git.

sources:
  source_images:
    path: /ABSOLUTE/PATH/TO/622_SOURCE_IMAGES
    description: Canonical Pennsylvania death-record source images
    expected_count: 622
    public: null
    checksum_manifest: null

  ground_truth:
    path: /ABSOLUTE/PATH/TO/GROUND_TRUTH
    description: Paper-lineage processed GT or another explicitly identified GT lineage
    expected_rows: 622
    sha256: null
    public: null
    lineage_role: paper_v9_v10_or_legacy_public_v7

  fold_assignments:
    path: /ABSOLUTE/PATH/TO/FOLDS
    description: Cross-validation fold assignments used for historical selection
    sha256: null

  historical_responses:
    path: /ABSOLUTE/PATH/TO/HISTORICAL_MODEL_OUTPUTS
    description: Paper-era Gemini 2.0 Flash outputs, including augmentation families and controls
    immutable: true

  historical_augmentations:
    path: /ABSOLUTE/PATH/TO/AUGMENTATION_CONFIGS_OR_IMAGES
    description: Historical transform configurations and/or generated images

  shift_analysis:
    path: /ABSOLUTE/PATH/TO/SHIFT_ANALYSIS
    description: Fine/coarse pixel-shift outputs used for periodicity analysis

  paper_code:
    path: /ABSOLUTE/PATH/TO/PAPER_CODE
    description: Historical analysis/consensus/augmentation scripts or notebooks

  usage_logs:
    path: /ABSOLUTE/PATH/TO/USAGE_OR_BILLING_LOGS
    description: Token, latency, API-usage, or billing evidence if available

  modern_responses:
    path: /ABSOLUTE/PATH/TO/NEW_MODEL_OUTPUTS
    description: New replication outputs; keep raw responses outside Git if large

  scratch:
    path: /ABSOLUTE/PATH/TO/SCRATCH
    description: Disposable transformed images/cache

evaluation:
  metric_field_names:
    - SelfGivenName
    - SelfSurname
    - FatherGivenName
    - FatherSurname
    - MotherGivenName
    - MotherSurname
  paper_row_population: 3684
  paper_row_population_formula: "622 records * 6 metric fields - 24 flagged records * 2 Self fields"
  paper_reported_nonblank_target: 3684
  paper_artifact_strict_nonblank_rows: 3683
  legacy_public_v7_row_population: 3682
  raw_edt_six_name_nonblank_count: 3718
  historical_filter:
    implementation: chat2rec/processing/common.py::_add_flags
    terms: [stillborn, infant, know, maiden, baby]
    match: case_insensitive_unanchored_substring_regex
    action: remove_field_rows_whose_name_starts_with_Self_on_flagged_records
  documentation: docs/GT_LINEAGE.md

notes:
  - Replace absolute paths only in the local manifest.
  - A later committed config/data_manifest.yaml should omit sensitive machine-specific paths and preserve portable provenance/counts/checksums.
