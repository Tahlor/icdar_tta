caveats:
  portability: This committed manifest contains no machine-specific absolute locations; resolve logical roots through the ignored local manifest.
  privacy: Raw images, labels, and model responses remain private unless their release status is separately established.
  evaluation: The six-field selector and historical exclusion rule are recovered. Use 3684 as the paper-era row-population target with the documented one-blank-row caveat; use 3682 only for the legacy/public v7 lineage. The raw 3718 _edt count is descriptive and is not a denominator.
  execution: The two-model modern transfer screen is complete and reconciled; Gemini 3.7 and Qwen full screens remain blocked by route failures, and no additional provider calls are implied by this manifest.
  render_lineage: A 5,598-row prospective modern render manifest was verified for the completed screen; exact historical Pad/Grid rendered pixels, historical seeds, and historical input-rule recovery remain unresolved.
  provenance: Current GT lineage is in docs/GT_LINEAGE.md; modern results are summarized in local_agent/MODERN_FULL_RECEIPT.md and outputs/derived/*.csv, while remaining historical/render/route caveats are recorded in local_agent/SOURCE_LINEAGE_AUDIT.md, local_agent/RENDER_LINEAGE_AUDIT.md, and local_agent/EXPERIMENT_MATRIX.md.
